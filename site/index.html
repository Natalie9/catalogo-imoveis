<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Catálogo de Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="config.js?v=decision-2"></script>
<script src="sheets.js?v=decision-2"></script>
<script src="ghdb.js?v=decision-2"></script>
<link rel="stylesheet" href="catalogo.css?v=decision-2">
<link rel="stylesheet" href="decision.css?v=decision-2">

</head>
<body>
<a class="skip" href="#list">Pular para os imóveis</a>
<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow">Natalie &amp; Jéssica · Catálogo compartilhado</span><h1>Nossa busca por uma casa</h1>
      <p class="lede">Acompanhe, avalie e compare as casas que estamos considerando.</p>
    </div>
    <div class="f"><label for="theme">Aparência</label><select id="theme"><option value="auto">Sistema</option><option value="light">Clara</option><option value="dark">Escura</option></select></div><div class="stats" id="stats"></div>
  </header>
  <div class="syncbar" id="syncbar"><span id="syncmsg" role="status" aria-live="polite">Carregando imóveis da planilha…</span><button type="button" id="syncbtn">Atualizar agora</button><a id="sheetlink" target="_blank" rel="noopener">Abrir planilha</a></div>

  <form class="filters" id="filters" onsubmit="return false">
    <div class="primary-filters"><div class="f"><label for="q">Buscar</label><input type="search" id="q" placeholder="bairro, rua, imobiliária…"></div><div class="f"><label for="bai">Bairro</label><select id="bai"></select></div><div class="f"><label for="pmin">Preço mínimo (R$)</label><input type="text" inputmode="decimal" id="pmin" placeholder="Sem limite"></div><div class="f"><label for="pmax">Preço máximo (R$)</label><input type="text" inputmode="decimal" id="pmax" placeholder="Sem limite"></div><div class="f"><label for="qmin">Quartos</label><select id="qmin"><option value="0">Qualquer</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></div><div class="f"><label for="sort">Ordenar</label><select id="sort"><option value="p">Menor preço</option><option value="pd">Maior preço</option><option value="l">Maior tamanho</option><option value="la">Menor tamanho</option><option value="nota">Maior nota (média das duas)</option><option value="notaa">Menor nota</option><option value="km">Mais perto da UFG</option><option value="r">Linha da planilha</option></select></div></div>
    <details class="advanced"><summary>Filtros avançados <span id="activefilters"></span></summary><div class="advanced-grid">
    <div class="f"><label for="imob">Imobiliária</label><select id="imob"></select></div><div class="f"><label for="lmin">Área mínima (m²)</label><input type="text" inputmode="decimal" id="lmin" placeholder="Sem limite"></div><div class="f"><label for="lmax">Área máxima (m²)</label><input type="text" inputmode="decimal" id="lmax" placeholder="Sem limite"></div>
    <div class="f"><label for="area">Tipo de área para filtrar e ordenar</label><select id="area"><option value="lote">Lote</option><option value="construida">Construída</option></select></div>
    <div class="f"><label for="pool">Piscina</label><select id="pool"><option value="">Qualquer</option><option value="sim">Com piscina</option><option value="prev">Com piscina ou espaço p/ piscina</option></select></div><div class="f"><label for="fin">Financiamento informado</label><select id="fin"><option value="">Qualquer</option><option value="sim">Sim</option><option value="nao">Não</option><option value="incerto">Não confirmado</option></select></div>
    <div class="f"><label for="nmin">Média das notas</label><select id="nmin"><option value="0">Qualquer</option><option value="duas">Avaliadas pelas duas</option><option value="3">3 ou mais</option><option value="4">4 ou mais</option><option value="4.5">4,5 ou mais</option><option value="5">Só 5</option><option value="sem">Sem nota</option></select></div><div class="f"><label for="natmin">Nota da Natalie</label><select id="natmin"><option value="0">Qualquer</option><option value="sem">Sem avaliação</option><option value="3">3 ou mais</option><option value="4">4 ou mais</option><option value="5">5 estrelas</option></select></div><div class="f"><label for="jesmin">Nota da Jéssica</label><select id="jesmin"><option value="0">Qualquer</option><option value="sem">Sem avaliação</option><option value="3">3 ou mais</option><option value="4">4 ou mais</option><option value="5">5 estrelas</option></select></div><div class="f"><label for="grp">Agrupar</label><select id="grp"><option value="">Sem agrupar</option><option value="imob">Por imobiliária</option><option value="nat">Por estrelas da Natalie</option><option value="jes">Por estrelas da Jéssica</option><option value="bai">Por bairro</option><option value="preco">Por faixa de preço</option><option value="tam">Por faixa de tamanho</option></select></div><label class="chk"><input type="checkbox" id="noalert"> Esconder ágio e alertas</label><label class="chk"><input type="checkbox" id="onlynat"> Só com comentário meu</label>
    </div></details><div class="filter-footer"><button type="button" class="reset" id="reset">Limpar filtros</button><span id="filter-error" role="status"></span><span class="count" id="count"></span></div>
  </form>

  <main>
    <section id="list" aria-label="Casas" tabindex="-1"></section>
  </main>
  <p class="note" id="note"></p>
</div>

<script src="catalogo.js?v=decision-2"></script>
<script src="decision.js?v=decision-2"></script>
</body>
</html>
