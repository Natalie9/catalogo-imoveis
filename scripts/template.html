<title>Catálogo de Imóveis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
/*__HEADEXTRA__*/
<style>
/* Layout: mapa fixo à esquerda + lista de casas à direita; no celular, mapa em cima e lista embaixo. */
:root{
  --bg:#f2f4ee; --surface:#fbfcf8; --ink:#17201a; --muted:#5d685e; --line:#d9ded3;
  --accent:#c98a0f; --accent-ink:#1d1606; --campus:#2f6a3c; --campus-soft:rgba(47,106,60,.10);
  --bad:#b2392a; --bad-bg:#f8e3df; --warn:#8a5a00; --warn-bg:#f6ead0; --info:#2c5d86; --info-bg:#e1ecf5; --off:#6b6f6a; --off-bg:#e6e7e3;
  --p1:#f0cf6b; --p2:#de9a2c; --p3:#b5562a; --p4:#6d2a12; --pin-stroke:#ffffff; --water:#e3e8de;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111611; --surface:#192019; --ink:#e6ebe3; --muted:#9ba697; --line:#2d372d;
  --accent:#f0b43a; --accent-ink:#1d1606; --campus:#7fbf8c; --campus-soft:rgba(127,191,140,.12);
  --bad:#f08b7c; --bad-bg:#3a1f1b; --warn:#e9be62; --warn-bg:#352a14; --info:#8dbbe2; --info-bg:#1b2a38; --off:#a5aaa3; --off-bg:#262b26;
  --p1:#f3d57a; --p2:#e6a23a; --p3:#d36f3d; --p4:#a8462a; --pin-stroke:#111611; --water:#151c15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111611; --surface:#192019; --ink:#e6ebe3; --muted:#9ba697; --line:#2d372d;
  --accent:#f0b43a; --accent-ink:#1d1606; --campus:#7fbf8c; --campus-soft:rgba(127,191,140,.12);
  --bad:#f08b7c; --bad-bg:#3a1f1b; --warn:#e9be62; --warn-bg:#352a14; --info:#8dbbe2; --info-bg:#1b2a38; --off:#a5aaa3; --off-bg:#262b26;
  --p1:#f3d57a; --p2:#e6a23a; --p3:#d36f3d; --p4:#a8462a; --pin-stroke:#111611; --water:#151c15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto}
h1{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:-.01em;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:.25rem 0 0;max-width:62ch}
header.top{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:1.35rem;font-weight:700;font-stretch:90%}
.stat span{font-family:var(--body);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.filters{background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f input[type=search],.f select{font:inherit;font-size:.92rem;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.f input[type=search]{width:min(260px,100%)}
.f input[type=range]{width:150px;accent-color:var(--accent)}
#imob,#bai{width:230px;max-width:100%}
.rng{position:relative;width:200px;height:24px}
.rng input[type=range]{position:absolute;inset:0;width:100%;height:24px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rng input[type=range]::-webkit-slider-runnable-track{background:none;height:24px}
.rng input[type=range]::-moz-range-track{background:none}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;margin-top:3px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
.rng input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer}
.rng .track,.rng .fill{position:absolute;top:10px;height:4px;border-radius:2px}
.rng .track{left:0;right:0;background:var(--line)}
.rng .fill{background:var(--accent)}
.f output{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:.9rem}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem;padding-bottom:6px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
button.reset{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:.85rem;color:var(--muted);margin-left:auto;padding-bottom:7px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px}
@media (min-width:980px){.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-height:380px}
#map{flex:1;min-height:340px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--pin-stroke);box-shadow:0 0 0 1px var(--line)}
.legend .ring{border:1.5px dashed var(--campus);background:none;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-content:start;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:110px;transition:box-shadow .2s,border-color .2s}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.card.off{opacity:.62}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--water);overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.ph .row{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:20px;font-family:var(--display)}
.ph .nph{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:20px}
.body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.price{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1;display:flex;align-items:center;gap:8px}
.price .dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid var(--pin-stroke);box-shadow:0 0 0 1px var(--line)}
.bairro{font-weight:700;line-height:1.25}
.rua{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;font-variant-numeric:tabular-nums}
.facts span{white-space:nowrap}
.facts .k{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.74rem;padding:2px 8px;border-radius:20px;background:var(--off-bg);color:var(--off);white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad);font-weight:700}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.imob{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.pool{background:#dcefff;color:#0b5c99;font-weight:700}
.chip.poolp{background:transparent;color:#0b5c99;border:1px dashed #6fa8d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.pool{background:#14324a;color:#9fd2ff}:root:not([data-theme="light"]) .chip.poolp{color:#9fd2ff;border-color:#3d6f96}}
:root[data-theme="dark"] .chip.pool{background:#14324a;color:#9fd2ff}:root[data-theme="dark"] .chip.poolp{color:#9fd2ff;border-color:#3d6f96}
.chip.dist{background:var(--campus-soft);color:var(--campus);font-weight:700}
.nat{font-size:.88rem;border-left:3px solid var(--accent);padding:2px 0 2px 9px;font-style:italic}
details{font-size:.84rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--ink);font-size:.82rem}
details p{margin:.4rem 0 0;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.foot a.go{font-family:var(--display);font-weight:700;font-size:.85rem;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:6px 11px;border-radius:7px}
.foot button.loc{font:inherit;font-size:.82rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 9px;cursor:pointer}
.foot .src{font-size:.78rem;color:var(--muted);margin-left:auto}
.grp{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.grp h2{font-family:var(--display);font-stretch:88%;font-size:1.15rem;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grp h2 small{font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--muted)}
.empty{grid-column:1/-1;padding:40px 10px;text-align:center;color:var(--muted)}
.note{font-size:.78rem;color:var(--muted);margin-top:22px;max-width:90ch}
/* mapa esquemático (SVG) */
svg.sch{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--surface)}
svg.sch .rg{fill:none;stroke:var(--campus);stroke-dasharray:4 5;stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.8}
svg.sch .rl{fill:var(--campus);font-size:11px;font-family:var(--display)}
svg.sch .lm{fill:var(--muted);font-size:11px;font-family:var(--body)}
svg.sch .lmd{fill:var(--muted)}
svg.sch .pin{stroke:var(--pin-stroke);stroke-width:1.5;cursor:pointer;vector-effect:non-scaling-stroke}
svg.sch .pin.sel{stroke:var(--ink);stroke-width:3}
svg.sch .campus{fill:var(--campus)}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.mapctl button{width:32px;height:32px;font-size:18px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:6;max-width:220px}
.tip b{font-family:var(--display)}
/* popups do Leaflet */
.leaflet-popup-content{margin:10px 12px;font-family:var(--body)}
.pop img{width:180px;height:135px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}
.pop b{font-family:var(--display);font-size:1rem}
/* avaliações */
.aval{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:8px;font-size:.84rem}
.srow .who{width:58px;color:var(--muted)}
.stars{display:inline-flex;gap:1px}
.stars button{background:none;border:0;padding:0 1px;font-size:1.25rem;line-height:1;color:var(--line);cursor:pointer}
.stars button.on{color:var(--accent)}
.stars button:disabled{cursor:default}
.srow .clr{font-size:.72rem;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.coms{display:flex;flex-direction:column;gap:5px;font-size:.85rem}
.com{background:var(--bg);border-radius:7px;padding:5px 8px;overflow-wrap:anywhere}
.com .meta{font-size:.72rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.com .meta button{margin-left:auto;font-size:.72rem;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.com .meta button.sure{color:var(--bad);font-weight:700}
.cform{display:flex;gap:6px;flex-wrap:wrap}
.cform textarea{flex:1 1 100%;min-height:2.4em;resize:vertical;font:inherit;font-size:.86rem;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.cform select,.cform button{font:inherit;font-size:.8rem;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cform button.send{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.avalnote{font-size:.78rem;color:var(--muted)}
.foot button.disc{font:inherit;font-size:.78rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.foot button.disc.sure{color:var(--bad);font-weight:700}
.card.gone{opacity:.55}
.syncbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:.84rem;color:var(--muted)}
.syncbar button{font:inherit;font-size:.84rem;font-weight:700;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.syncbar button:disabled{opacity:.55;cursor:default}
.syncbar .err{color:var(--bad)}
.idtag{font-family:var(--display);font-size:.7rem;color:var(--muted);letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Catálogo de Imóveis</h1>
      <p class="lede">Casas da planilha da Natalie, com foto, preço e distância em linha reta até o Campus Samambaia da UFG. Casas com status Rejeitado na planilha ou descartadas aqui ficam escondidas.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="syncbar" id="syncbar" hidden><button type="button" id="syncbtn" hidden>Sincronizar com a planilha</button><span id="syncmsg"></span></div>

  <form class="filters" id="filters" onsubmit="return false">
    <div class="f"><label for="q">Buscar</label><input type="search" id="q" placeholder="bairro, rua, imobiliária…"></div>
    <div class="f"><label for="imob">Imobiliária</label><select id="imob"></select></div>
    <div class="f"><label for="bai">Bairro</label><select id="bai"></select></div>
    <div class="f"><label for="pmin">Preço <output id="prango"></output></label><div class="rng"><span class="track"></span><span class="fill" id="pfill"></span><input type="range" id="pmin" min="100000" max="700000" step="10000" aria-label="Preço mínimo"><input type="range" id="pmax" min="100000" max="700000" step="10000" aria-label="Preço máximo"></div></div>
    <div class="f"><label for="lmin">Tamanho <output id="lrango"></output></label><div class="rng"><span class="track"></span><span class="fill" id="lfill"></span><input type="range" id="lmin" min="0" max="600" step="10" aria-label="Tamanho mínimo do lote"><input type="range" id="lmax" min="0" max="600" step="10" aria-label="Tamanho máximo do lote"></div></div>
    <div class="f"><label for="pool">Piscina</label><select id="pool"><option value="">Qualquer</option><option value="sim">Com piscina</option><option value="prev">Com piscina ou espaço p/ piscina</option></select></div>
    <div class="f"><label for="qmin">Quartos</label><select id="qmin"><option value="0">Qualquer</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></div>
    <div class="f"><label for="nmin">Média das notas</label><select id="nmin"><option value="0">Qualquer</option><option value="duas">Avaliadas pelas duas</option><option value="3">3 ou mais</option><option value="4">4 ou mais</option><option value="4.5">4,5 ou mais</option><option value="5">Só 5</option><option value="sem">Sem nota</option></select></div>
    <div class="f"><label for="grp">Agrupar</label><select id="grp"><option value="">Sem agrupar</option><option value="imob">Por imobiliária</option><option value="nat">Por estrelas da Natalie</option><option value="jes">Por estrelas da Jéssica</option><option value="bai">Por bairro</option><option value="preco">Por faixa de preço</option><option value="tam">Por faixa de tamanho</option></select></div>
    <div class="f"><label for="sort">Ordenar</label><select id="sort"><option value="p">Menor preço</option><option value="pd">Maior preço</option><option value="l">Maior tamanho</option><option value="la">Menor tamanho</option><option value="nota">Maior nota (média das duas)</option><option value="notaa">Menor nota</option><option value="km">Mais perto da UFG</option><option value="r">Linha da planilha</option></select></div>
    <label class="chk"><input type="checkbox" id="noalert"> Esconder ágio e alertas</label>
    <label class="chk"><input type="checkbox" id="onlynat"> Só com comentário meu</label>
    <label class="chk"><input type="checkbox" id="showdisc"> Mostrar descartadas</label>
    <button type="button" class="reset" id="reset">Limpar filtros</button>
    <span class="count" id="count"></span>
  </form>

  <main>
    <section id="list" aria-label="Casas"></section>
  </main>
  <p class="note" id="note"></p>
</div>

<script>
const DATA=/*__DATA__*/;
const MODE="/*__MODE__*/";
/* local = arquivo no computador; pub = link do claude.ai; gh = GitHub Pages (fotos em arquivos + notas na Planilha Google) */
const LOCALISH=MODE==="local"||MODE==="gh", HASDB=MODE==="pub"||MODE==="gh";
const UFG=[-16.60457,-49.2624];
const LANDMARKS=[["Centro",-16.67487,-49.25818],["Shopping Flamboyant",-16.71051,-49.23634],["Aparecida de Goiânia",-16.7590,-49.2740],["Senador Canedo",-16.7013,-49.0915]];
const $=s=>document.querySelector(s);
const brl=v=>v==null?"Preço não informado":"R$ "+Math.round(v).toLocaleString("pt-BR");
const brlk=v=>"R$ "+Math.round(v/1000)+" mil";
const PB=[300000,400000,500000];
function pcol(p){if(p==null)return "var(--off)";return p<PB[0]?"var(--p1)":p<PB[1]?"var(--p2)":p<PB[2]?"var(--p3)":"var(--p4)";}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function pcolHex(p){const m={"var(--p1)":"--p1","var(--p2)":"--p2","var(--p3)":"--p3","var(--p4)":"--p4","var(--off)":"--off"};return cssVar(m[pcol(p)])}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isAlert=d=>d.tags.some(t=>t[0]==="bad");

/* ---------- estado e filtros ---------- */
const PMIN=100000,PMAX=700000,PSTEP=10000,LMIN=0,LMAX=600,LSTEP=10;
const DEF={q:"",pmin:PMIN,pmax:PMAX,lmin:LMIN,lmax:LMAX,imob:"",bai:"",pool:"",qmin:"0",sort:"p",noalert:false,onlynat:false,showdisc:false,nmin:"0",grp:""};
let S={...DEF};
try{Object.assign(S,JSON.parse(localStorage.getItem("cat-filtros")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("cat-filtros",JSON.stringify(S))}catch(e){}}
function bindUI(){
  fillSelects();
  $("#q").value=S.q;$("#pmin").value=S.pmin??PMIN;$("#pmax").value=S.pmax??PMAX;$("#lmin").value=S.lmin??LMIN;$("#lmax").value=S.lmax??LMAX;$("#imob").value=S.imob||"";$("#pool").value=S.pool||"";$("#bai").value=S.bai||"";if($("#imob").value!==(S.imob||""))S.imob="";if($("#bai").value!==(S.bai||""))S.bai="";$("#qmin").value=S.qmin;$("#sort").value=S.sort;$("#noalert").checked=S.noalert;$("#onlynat").checked=S.onlynat;$("#showdisc").checked=S.showdisc;$("#nmin").value=S.nmin||"0";$("#grp").value=S.grp||"";
  const up=(e)=>{let lo=+$("#pmin").value,hi=+$("#pmax").value;if(lo>hi-PSTEP){if(e&&e.target.id==="pmin"){lo=Math.max(PMIN,hi-PSTEP);$("#pmin").value=lo}else{hi=Math.min(PMAX,lo+PSTEP);$("#pmax").value=hi}}
    let llo=+$("#lmin").value,lhi=+$("#lmax").value;if(llo>lhi-LSTEP){if(e&&e.target.id==="lmin"){llo=Math.max(LMIN,lhi-LSTEP);$("#lmin").value=llo}else{lhi=Math.min(LMAX,llo+LSTEP);$("#lmax").value=lhi}}

const normK=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function baiNome(b){return (b||"").replace(/\(.*?\)/g,"").replace(/^\s*(bairro|setor)\s+/i,"").replace(/\s+/g," ").trim()||"Sem bairro"}

  return [...M.entries()].map(([k,g])=>[k,Object.entries(g.v).sort((a,b)=>b[1]-a[1])[0][0],g.c]).sort((a,b)=>a[1].localeCompare(b[1],"pt-BR"))}
function fillSelects(){

function filtered(){
  const q=S.q.trim().toLowerCase();
  let a=DATA.filter(d=>{
    if(q&&!(d.b+" "+(d.rua||"")+" "+(d.i||"")+" "+d.s+" "+(d.c||"")+" "+d.r).toLowerCase().includes(q))return false;
    if(S.pmax<PMAX&&d.p!=null&&d.p>S.pmax)return false;
    if(S.pmin>PMIN&&d.p!=null&&d.p<S.pmin)return false;
    {const a=S.lmin??LMIN,b=S.lmax??LMAX;if((a>LMIN||b<LMAX)&&(!(d.l>0)||d.l<a||(b<LMAX&&d.l>b)))return false}
    if(S.pool==="sim"&&!(d.pool==="sim"||d.pool==="cond"))return false;
    if(S.pool==="prev"&&!d.pool)return false;
    if(S.imob&&normK(imobNome(d))!==S.imob)return false;
    if(S.bai&&baiK(d.b)!==S.bai)return false;
    if(+S.qmin&&!(d.q>=+S.qmin))return false;
    if(S.noalert&&isAlert(d))return false;
    if(S.onlynat&&!d.nat&&!(COMS[d.id]||[]).length)return false;
    if(!S.showdisc&&isGone(d))return false;
    if(S.nmin&&S.nmin!=="0"){const m=media(d.id),n=nRaters(d.id);
      if(S.nmin==="sem"){if(m!=null)return false}
      else if(S.nmin==="duas"){if(n<2)return false}
      else if(m==null||m<+S.nmin)return false}
    return true});
  const big=1e12;
  const k={nota:d=>-((media(d.id)??-1)*10+nRaters(d.id)),km:d=>d.km??big,p:d=>d.p??big,pd:d=>-(d.p??-big),l:d=>-(d.l??0),la:d=>d.l??big,notaa:d=>{const m=media(d.id);return m==null?big:m*10-nRaters(d.id)},r:d=>d.r}[S.sort];
  return a.sort((x,y)=>k(x)-k(y)||x.r-y.r);
}

  else if(S.grp){

      preco:d=>{const [o,n]=FX(d.p,PL,"preço",v=>brlk(v));return [String(o),n,o]},
      nat:d=>{const e=(notasDe(d.id)||{}).natalie||0;return [String(e),e?"★".repeat(e)+"☆".repeat(5-e)+" · Natalie deu "+e+(e>1?" estrelas":" estrela"):"Natalie ainda não deu nota",e?5-e:9]},
      jes:d=>{const e=(notasDe(d.id)||{}).jessica||0;return [String(e),e?"★".repeat(e)+"☆".repeat(5-e)+" · Jéssica deu "+e+(e>1?" estrelas":" estrela"):"Jéssica ainda não deu nota",e?5-e:9]},
      tam:d=>{const [o,n]=FX(d.l,TL,"tamanho",v=>v+" m²");return [String(o),n,o]}}[S.grp]||(d=>["","",0]);
    const G=new Map(); a.forEach(d=>{const [k,n,o]=key(d); if(!G.has(k))G.set(k,{n,o,l:[]}); G.get(k).l.push(d)});
    const ordered=["preco","tam","nat","jes"].includes(S.grp);
    const gs=[...G.values()].sort((x,y)=>ordered?x.o-y.o:(x.o-y.o||y.l.length-x.l.length||x.n.localeCompare(y.n,"pt-BR")));
    $("#list").innerHTML=gs.map(g=>{const ms=g.l.map(d=>media(d.id)).filter(v=>v!=null);const m=ms.length?(ms.reduce((p,c)=>p+c,0)/ms.length).toLocaleString("pt-BR",{maximumFractionDigits:1}):null;
      const ps=g.l.map(d=>d.p).filter(v=>v>0).sort((x,y)=>x-y), pm=ps.length&&S.grp!=="preco"?" · preço mediano "+brlk(ps[Math.floor(ps.length/2)]):"";
      return `<section class="grp"><h2>${esc(g.n)} <small>${g.l.length} casa${g.l.length>1?"s":""}${pm}${m?` · média ${m}`:""}</small></h2><div class="grid">${g.l.map(card).join("")}</div></section>`}).join("");
  } else $("#list").innerHTML=`<div class="grid">${a.map(card).join("")}</div>`;
  $("#count").textContent=`${a.length} de ${DATA.filter(d=>!isGone(d)).length} casas`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button.loc");
  if(b){focusPin(+b.dataset.r);return}
  const ph=e.target.closest(".ph");
  if(ph){const d=DATA.find(x=>x.r==ph.closest(".card").dataset.r);
    if(LOCALISH&&d.img.length>1){const i=(+ph.dataset.i+1)%d.img.length;ph.dataset.i=i;const im=ph.querySelector("img");if(im)im.src=(i===0&&d.foto)?"fotos/"+d.id+".webp":d.img[i];const n=ph.querySelector(".nph");if(n)n.textContent=(i+1)+"/"+d.img.length}
    else window.open(d.u,"_blank","noopener");}
});
function highlight(r){
  document.querySelectorAll(".card.hl").forEach(c=>c.classList.remove("hl"));
  const c=document.getElementById("c"+r); if(c){c.classList.add("hl");c.scrollIntoView({behavior:"smooth",block:"nearest"})}
}

/* ---------- legenda ---------- */
function legend(){
  $("#legend").innerHTML=`<span><i style="background:var(--p1)"></i>até 300 mil</span><span><i style="background:var(--p2)"></i>300–400 mil</span><span><i style="background:var(--p3)"></i>400–500 mil</span><span><i style="background:var(--p4)"></i>acima de 500 mil</span><span><i class="ring"></i>anéis de 2, 5 e 10 km da UFG</span>`;
}

/* ---------- mapa Leaflet (arquivo local) ---------- */
let LM=null, markers={};
function initLeaflet(){
  LM=L.map("map",{scrollWheelZoom:true}).setView([-16.635,-49.265],12);
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  L.tileLayer("https://{s}.basemaps.cartocdn.com/"+(dark?"dark_all":"rastertiles/voyager")+"/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(LM);
  [2000,5000,10000].forEach(m=>L.circle(UFG,{radius:m,color:cssVar("--campus"),weight:1.5,dashArray:"4 6",fill:false,interactive:false}).addTo(LM));
  L.circleMarker(UFG,{radius:9,color:"#fff",weight:2,fillColor:cssVar("--campus"),fillOpacity:1}).addTo(LM).bindTooltip("UFG – Campus Samambaia",{permanent:true,direction:"right",offset:[10,0]});
}
function renderLeaflet(a){
  Object.values(markers).forEach(m=>m.remove()); markers={};
  a.filter(d=>d.lat!=null).forEach(d=>{
    const m=L.circleMarker([d.lat,d.lng],{radius:isAlert(d)?6:7,color:isAlert(d)?cssVar("--bad"):"#fff",weight:isAlert(d)?2.5:1.5,fillColor:pcolHex(d.p),fillOpacity:.95}).addTo(LM);
    const im=d.img[0]||(d.th?"data:image/webp;base64,"+d.th:"");
    m.bindPopup(`<div class="pop">${im?`<img src="${im}" alt="">`:""}<b>${brl(d.p)}</b><br>${esc(d.b)}<br><small>${d.q??"?"} quartos · ${d.km?.toLocaleString("pt-BR")} km da UFG · linha ${d.r}</small><br><a href="${esc(d.u)}" target="_blank" rel="noopener">Abrir anúncio</a></div>`);
    m.on("click",()=>highlight(d.r)); markers[d.r]=m;
  });
}

/* ---------- mapa esquemático (versão publicada) ---------- */
const SV={};
function proj(lat,lng){const k=Math.cos(16.63*Math.PI/180);return [(lng+49.27)*k*1000,(-(lat+16.64))*1000]}
function initSchematic(){
  const box=$("#map");
  box.innerHTML=`<svg class="sch" id="sch" role="img" aria-label="Mapa esquemático das casas em relação à UFG"><g id="vp"></g></svg><div class="mapctl"><button type="button" id="zi" aria-label="Aproximar">+</button><button type="button" id="zo" aria-label="Afastar">−</button><button type="button" id="zr" aria-label="Enquadrar tudo" style="font-size:13px">⤢</button></div><div class="tip" id="tip" hidden></div>`;
  const svg=$("#sch"); SV.svg=svg;
  const pts=DATA.filter(d=>d.lat!=null&&d.lng<-49.15).map(d=>proj(d.lat,d.lng));
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  SV.home=[Math.min(...xs)-8,Math.min(...ys)-8,Math.max(...xs)-Math.min(...xs)+16,Math.max(...ys)-Math.min(...ys)+16];
  SV.vb=[...SV.home]; setVB();
  const [ux,uy]=proj(...UFG); const kmU=1000/111.32;
  let g=`<g id="rings">`;
  [2,5,10].forEach(k=>{g+=`<circle class="rg" cx="${ux}" cy="${uy}" r="${k*kmU}"/><text class="rl" x="${ux+k*kmU*0.71+1}" y="${uy+k*kmU*0.71+10}">${k} km</text>`});
  g+=`</g><g id="lms">`;
  LANDMARKS.forEach(([n,la,lo])=>{const [x,y]=proj(la,lo);g+=`<circle class="lmd" cx="${x}" cy="${y}" r="1.6"/><text class="lm" x="${x+3}" y="${y-3}">${n}</text>`});
  g+=`</g><g id="pins"></g><circle class="campus" cx="${ux}" cy="${uy}" r="5"/><text class="rl" x="${ux+7}" y="${uy-6}" style="font-weight:700">UFG Samambaia</text>`;
  $("#vp").innerHTML=g;
  // pan & zoom
  let drag=null;
  svg.addEventListener("pointerdown",e=>{if(e.target.classList.contains("pin"))return;drag={x:e.clientX,y:e.clientY,vb:[...SV.vb]};svg.setPointerCapture(e.pointerId)});
  svg.addEventListener("pointermove",e=>{if(!drag)return;const r=svg.getBoundingClientRect(),s=Math.max(SV.vb[2]/r.width,SV.vb[3]/r.height);SV.vb[0]=drag.vb[0]-(e.clientX-drag.x)*s;SV.vb[1]=drag.vb[1]-(e.clientY-drag.y)*s;setVB()});
  svg.addEventListener("pointerup",()=>drag=null);
  svg.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?0.8:1.25,e)},{passive:false});
  $("#zi").onclick=()=>zoom(0.7);$("#zo").onclick=()=>zoom(1.4);$("#zr").onclick=()=>{SV.vb=[...SV.home];setVB()};
  new ResizeObserver(setVB).observe(svg);
}
function setVB(){const v=SV.vb;SV.svg.setAttribute("viewBox",v.join(" "));const r=SV.svg.getBoundingClientRect();const s=Math.max(v[2]/(r.width||1),v[3]/(r.height||1));SV.scale=s;
  document.querySelectorAll("#sch .pin").forEach(p=>p.setAttribute("r",(p.classList.contains("al")?5.5:6.5)*s));
  document.querySelectorAll("#sch text").forEach(t=>t.style.fontSize=(11*s)+"px");
  document.querySelectorAll("#sch .campus").forEach(c=>c.setAttribute("r",7*s));
  document.querySelectorAll("#sch .lmd").forEach(c=>c.setAttribute("r",2.2*s));}
function zoom(f,e){const v=SV.vb;let cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;
  if(e&&e.clientX!=null){const r=SV.svg.getBoundingClientRect(),s=Math.max(v[2]/r.width,v[3]/r.height);cx=v[0]+v[2]/2+(e.clientX-r.left-r.width/2)*s;cy=v[1]+v[3]/2+(e.clientY-r.top-r.height/2)*s}
  const w=v[2]*f,h=v[3]*f;SV.vb=[cx-w/2-(cx-(v[0]+v[2]/2))*f,cy-h/2-(cy-(v[1]+v[3]/2))*f,w,h];setVB()}
function renderSchematic(a){
  const tip=$("#tip");
  $("#pins").innerHTML=a.filter(d=>d.lat!=null).map(d=>{const [x,y]=proj(d.lat,d.lng);return `<circle class="pin${isAlert(d)?" al":""}" data-r="${d.r}" cx="${x}" cy="${y}" r="6" style="fill:${pcol(d.p)}${isAlert(d)?";stroke:var(--bad)":""}"><title>${esc(brl(d.p)+" – "+d.b)}</title></circle>`}).join("");
  document.querySelectorAll("#sch .pin").forEach(p=>{
    const d=DATA.find(x=>x.r==p.dataset.r);
    p.addEventListener("click",()=>{selPin(d.r);highlight(d.r)});
    p.addEventListener("pointerenter",e=>{const r=$("#map").getBoundingClientRect();tip.hidden=false;tip.innerHTML=`<b>${brl(d.p)}</b><br>${esc(d.b)}<br>${d.q??"?"} quartos · ${d.km?.toLocaleString("pt-BR")} km`;tip.style.left=Math.min(e.clientX-r.left+12,r.width-230)+"px";tip.style.top=(e.clientY-r.top+12)+"px"});
    p.addEventListener("pointerleave",()=>tip.hidden=true);
  });
  setVB();
}
function selPin(r){document.querySelectorAll("#sch .pin.sel").forEach(p=>p.classList.remove("sel"));const p=document.querySelector(`#sch .pin[data-r="${r}"]`);if(p){p.classList.add("sel");p.parentNode.appendChild(p)}}
function focusPin(r){
  const d=DATA.find(x=>x.r===r); if(!d||d.lat==null)return;
  $("#map").scrollIntoView({behavior:"smooth",block:"nearest"});
  if(LOCALISH&&LM){LM.setView([d.lat,d.lng],15);markers[r]&&markers[r].openPopup()}
  else{const [x,y]=proj(d.lat,d.lng);const w=Math.min(SV.home[2],40),h=w*SV.home[3]/SV.home[2];SV.vb=[x-w/2,y-h/2,w,h];setVB();selPin(r)}
  highlight(r);
}

/* ---------- render ---------- */
function render(){
  const lo=S.pmin??PMIN,hi=S.pmax??PMAX;
  $("#prango").textContent=(lo<=PMIN&&hi>=PMAX)?"qualquer":(lo<=PMIN?"até "+brlk(hi):hi>=PMAX?"a partir de "+brlk(lo):brlk(lo)+" – "+brlk(hi));
  const f=$("#pfill");f.style.left=((lo-PMIN)/(PMAX-PMIN)*100)+"%";f.style.right=((PMAX-hi)/(PMAX-PMIN)*100)+"%";
  const l1=S.lmin??LMIN,l2=S.lmax??LMAX;
  $("#lrango").textContent=(l1<=LMIN&&l2>=LMAX)?"qualquer":(l1<=LMIN?"até "+l2+" m²":l2>=LMAX?"a partir de "+l1+" m²":l1+" – "+l2+" m²");
  const lf=$("#lfill");lf.style.left=((l1-LMIN)/(LMAX-LMIN)*100)+"%";lf.style.right=((LMAX-l2)/(LMAX-LMIN)*100)+"%";
  const a=filtered(); stats(a); renderList(a);
  
}
const semLoc=DATA.filter(d=>d.lat==null).map(d=>"linha "+d.r).join(", ");
$("#note").textContent=`Distâncias em linha reta até a UFG, calculadas a partir do centro do bairro (dados do OpenStreetMap). Sem distância: ${semLoc||"nenhuma"}. Fotos tiradas dos próprios anúncios. Tamanho com * = área construída ou do anúncio, porque o lote não foi informado.`+(LOCALISH?" Clique na foto para ver a próxima.":"");
bindUI();

render();
initDB();
</script>
