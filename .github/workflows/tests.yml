name: Validar catálogo
on:
  pull_request:
    paths: ['site/**', 'apps_script/**', 'tests/**', 'package*.json', 'scripts/**', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
